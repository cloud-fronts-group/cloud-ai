<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Cloud AI — full-colour logo. Same cloud geometry as icon-mono.svg, scaled 17x. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#10284a"/>
      <stop offset="100%" stop-color="#050a14"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfe4ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.55" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.7"/>
      <feOffset dy="0.6" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- Faint circuit traces in the corners for depth -->
  <g opacity="0.22" stroke="#22d3ee" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M72 96V150H120"/>
    <path d="M440 88H392V136"/>
    <path d="M456 420V366H408"/>
    <path d="M64 428H112V380"/>
  </g>
  <g fill="#22d3ee" opacity="0.35">
    <circle cx="72" cy="96" r="5"/><circle cx="440" cy="88" r="5"/>
    <circle cx="456" cy="420" r="5"/><circle cx="64" cy="428" r="5"/>
  </g>

  <!-- Cloud body -->
  <g transform="translate(50 54) scale(17)" filter="url(#shadow)">
    <path d="M7 17.5H17A3.3 3.3 0 1 0 16.72 10.96A5.25 5.25 0 1 0 6.24 11.59A3 3 0 0 0 7 17.5Z"
          fill="url(#cloud)" stroke="url(#accent)" stroke-width="0.55" stroke-linejoin="round"/>
  </g>

  <!-- Neural graph -->
  <g transform="translate(50 54) scale(17)" filter="url(#glow)" fill="none" stroke="url(#accent)" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 14L11.5 10.5L14 14H9"/>
  </g>
  <g transform="translate(50 54) scale(17)" fill="url(#accent)">
    <circle cx="9" cy="14" r="1.2"/>
    <circle cx="14" cy="14" r="1.2"/>
    <circle cx="11.5" cy="10.5" r="1.2"/>
  </g>
  <g transform="translate(50 54) scale(17)" fill="#ffffff" opacity="0.9">
    <circle cx="9" cy="14" r="0.45"/>
    <circle cx="14" cy="14" r="0.45"/>
    <circle cx="11.5" cy="10.5" r="0.45"/>
  </g>
</svg>
