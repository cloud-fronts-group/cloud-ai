<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Cloud AI — Marketplace logo (master vector, 128x128).
       Same cloud geometry as icon-mono.svg (24-unit path, scaled 4.8x). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1730"/>
      <stop offset="1" stop-color="#05070e"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Tile -->
  <rect width="128" height="128" rx="28" fill="url(#tile)"/>
  <rect x="0.75" y="0.75" width="126.5" height="126.5" rx="27.25" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.5"/>

  <!-- Ambient halo behind the cloud -->
  <ellipse cx="64" cy="68" rx="58" ry="44" fill="url(#halo)"/>

  <!-- Cloud body: luminous gradient with glow -->
  <g transform="translate(5.7 7) scale(4.8)">
    <path d="M7 17.5H17A3.3 3.3 0 1 0 16.72 10.96A5.25 5.25 0 1 0 6.24 11.59A3 3 0 0 0 7 17.5Z"
          fill="url(#cloud)" filter="url(#glow)"/>
    <path d="M7 17.5H17A3.3 3.3 0 1 0 16.72 10.96A5.25 5.25 0 1 0 6.24 11.59A3 3 0 0 0 7 17.5Z"
          fill="url(#sheen)"/>
    <path d="M7 17.5H17A3.3 3.3 0 1 0 16.72 10.96A5.25 5.25 0 1 0 6.24 11.59A3 3 0 0 0 7 17.5Z"
          fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="0.22" stroke-linejoin="round"/>
  </g>

  <!-- Neural graph: white nodes and edges, glowing -->
  <g transform="translate(5.7 7) scale(4.8)" filter="url(#softglow)" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M9 14L11.5 10.5L14 14H9" stroke-width="0.62"/>
  </g>
  <g transform="translate(5.7 7) scale(4.8)" fill="#ffffff" filter="url(#softglow)">
    <circle cx="9" cy="14" r="1.25"/>
    <circle cx="14" cy="14" r="1.25"/>
    <circle cx="11.5" cy="10.5" r="1.25"/>
  </g>
  <g transform="translate(5.7 7) scale(4.8)" fill="#22d3ee">
    <circle cx="9" cy="14" r="0.5"/>
    <circle cx="14" cy="14" r="0.5"/>
    <circle cx="11.5" cy="10.5" r="0.5"/>
  </g>

  <!-- AI sparkle, upper right -->
  <g transform="translate(103 30)" fill="#ffffff" filter="url(#softglow)">
    <path d="M0 -7Q0.9 -0.9 7 0Q0.9 0.9 0 7Q-0.9 0.9 -7 0Q-0.9 -0.9 0 -7Z"/>
  </g>
  <g transform="translate(90 46)" fill="#a5f3fc" opacity="0.9">
    <path d="M0 -3Q0.4 -0.4 3 0Q0.4 0.4 0 3Q-0.4 0.4 -3 0Q-0.4 -0.4 0 -3Z"/>
  </g>
</svg>
