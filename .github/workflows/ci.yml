name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  extension:
    name: Typecheck, build and package the VSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx @vscode/vsce package --no-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-ai-vsix
          path: "*.vsix"

  backend:
    name: Backend protocol smoke test (mock Ollama)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: python backend/tests/smoke_test.py
      - run: python backend/tests/smoke_test_unsloth.py
