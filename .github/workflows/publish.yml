# Publishes the extension to the VS Code Marketplace with Trusted Publishing.
#
# No Personal Access Token is stored anywhere. The Marketplace has a Trusted
# Publishing policy for the `cloud-fronts-group` publisher that accepts a GitHub
# OIDC token minted by THIS file (publish.yml) running in the `production`
# environment of cloud-fronts-group/cloud-ai. Rename the file or the
# environment and the policy stops matching.
#
# Release flow:  bump "version" in package.json  →  git tag vX.Y.Z  →  git push --tags
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual re-run of a tag, e.g. after a transient Marketplace error

jobs:
  build:
    name: Typecheck, build and package the VSIX
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi
      - run: npm run package # vscode:prepublish runs the esbuild bundle first
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-ai-vsix
          path: "*.vsix"
          if-no-files-found: error

  publish:
    name: Publish to the VS Code Marketplace
    needs: build
    runs-on: ubuntu-latest
    environment: production # must match the Trusted Publishing policy
    permissions:
      contents: write # attach the VSIX to the GitHub release
      id-token: write # mint the OIDC token the Marketplace exchanges
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cloud-ai-vsix
      - name: Attach VSIX to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" ./*.vsix --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: vsce publish (OIDC, no PAT)
        # Each GitHub OIDC token can be exchanged exactly once and the Marketplace
        # credential lives 15 minutes, so publish is the only step that uses it.
        run: npx --yes @vscode/vsce@^4.1.0 publish --oidc --packagePath ./*.vsix
