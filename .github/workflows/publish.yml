# Publishes the extension to the VS Code Marketplace with Trusted Publishing.
#
# No Personal Access Token is stored anywhere. The Marketplace has a Trusted
# Publishing policy for the `cloud-fronts-group` publisher that accepts a GitHub
# OIDC token minted by THIS file (publish.yml) running in the `production`
# environment of cloud-fronts-group/cloud-ai. Rename the file or the
# environment and the policy stops matching.
#
# Release flow:  bump "version" in package.json  →  git tag vX.Y.Z  →  git push --tags
# The tag builds, tests, creates the GitHub release with the VSIX and publishes it.
#
# Docs: https://code.visualstudio.com/api/working-with-extensions/publishing-extension#secure-automated-publishing-to-visual-studio-marketplace
#       https://learn.microsoft.com/azure/devops/extend/publish/overview#publish-with-oidc-trusted-publishing
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual re-run of a tag, e.g. after a transient Marketplace error

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    name: Typecheck, build and package the VSIX
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run typecheck
      - run: pip install -r backend/requirements.txt
      - run: npm run test:backend
      - name: Version must be higher than the Marketplace's, and the listing keywords must be present
        run: |
          node - <<'EOF'
          const pkg = require("./package.json");
          const id = `${pkg.publisher}.${pkg.name}`;
          // The listing must keep appearing in the Kubernetes extension's cloud-provider search.
          for (const k of ["kubernetes-extension-cloud-provider"]) {
            if (!(pkg.keywords || []).includes(k)) {
              console.log(`::error::package.json keywords lack "${k}": publishing would drop the listing from that Marketplace search`);
              process.exit(1);
            }
          }
          const num = (v) => v.split("-")[0].split(".").map(Number);
          const newer = (a, b) => { const [x, y] = [num(a), num(b)]; for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] > y[i]; return false; };
          fetch("https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery", {
            method: "POST",
            headers: { Accept: "application/json;api-version=7.2-preview.1", "Content-Type": "application/json" },
            body: JSON.stringify({ filters: [{ criteria: [{ filterType: 7, value: id }] }], flags: 1 }),
          })
            .then((r) => r.json())
            .then((j) => {
              const live = j.results?.[0]?.extensions?.[0]?.versions?.[0]?.version;
              console.log(`package.json ${pkg.version} · Marketplace ${live ?? "(not published)"}`);
              if (live && !newer(pkg.version, live)) {
                console.log(`::error::${id} ${live} is already on the Marketplace; bump "version" above it`);
                process.exit(1);
              }
            });
          EOF
      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi
      - run: npm run package # vscode:prepublish runs the esbuild bundle first
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-ai-vsix
          path: "*.vsix"
          if-no-files-found: error

  publish:
    name: Publish to the VS Code Marketplace
    needs: build
    runs-on: ubuntu-latest
    environment: production # must match the Trusted Publishing policy
    permissions:
      contents: write # attach the VSIX to the GitHub release
      id-token: write # mint the OIDC token the Marketplace exchanges
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cloud-ai-vsix
      - name: Attach VSIX to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" ./*.vsix --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: vsce publish (OIDC, no PAT)
        # Each GitHub OIDC token can be exchanged exactly once and the Marketplace
        # credential lives 15 minutes, so publish is the only step that uses it.
        run: npx --yes @vscode/vsce@^4.1.1 publish --oidc --packagePath ./*.vsix
